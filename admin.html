<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>إجابات الاستبيان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="wrap" id="login-view" hidden>
    <form class="card login" id="login">
        <h1>تسجيل الدخول</h1>
        <div class="alert" id="login-error" hidden></div>
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" autocomplete="username" required autofocus>
        <label for="pass">كلمة المرور</label>
        <input type="password" id="pass" autocomplete="current-password" required>
        <button type="submit" class="btn">دخول</button>
    </form>
</main>

<main class="wrap wide" id="dash" hidden>
    <div class="topbar">
        <div>
            <h1>إجابات الاستبيان</h1>
            <p class="count">عدد الإجابات: <strong id="total">0</strong></p>
        </div>
        <div class="tools">
            <button type="button" class="btn small" id="export">تصدير Excel (CSV)</button>
            <button type="button" class="btn ghost small" id="logout">خروج</button>
        </div>
    </div>

    <nav class="tabs">
        <button type="button" data-view="stats" class="on">ملخص النتائج</button>
        <button type="button" data-view="table">كل الإجابات</button>
    </nav>

    <div id="content"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/questions.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
